<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF7F2">
<title>Mirye Gukbap Guide</title>
<style>
:root{
  --paper:#FAF7F2; --card:#FFFFFF; --ink:#2A2522; --muted:#7A6F66; --line:#E7DFD5;
  --red:#C01E2D; --red-soft:#F8E8E8; --gold:#FBF3E2;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Apple SD Gothic Neo","Noto Sans KR","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;font-size:16px}
img{display:block;max-width:100%}
.wrap{max-width:560px;margin:0 auto}
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

/* ---------- language select ---------- */
#select{min-height:100svh;display:flex;flex-direction:column}
#select .hero{position:relative}
#select .hero img{width:100%;aspect-ratio:1200/518;object-fit:cover}
#select .hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,var(--paper))}
.sel-body{flex:1;padding:8px 20px 40px;text-align:center}
.brand-ko{font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--ink)}
.brand-sub{margin-top:2px;font-size:14px;color:var(--muted);letter-spacing:.08em}
.seal{display:block;width:10px;height:10px;background:var(--red);border-radius:2px;margin:18px auto 14px}
.welcome{font-size:20px;font-weight:700}
.choose{margin-top:4px;font-size:13px;color:var(--muted)}
.lang-list{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.lang-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 22px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);font:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s,transform .1s}
.lang-btn small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.lang-btn .arr{color:var(--red);font-size:22px;line-height:1}
.lang-btn:active{transform:scale(.985)}
.lang-btn.suggested{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

/* ---------- guide ---------- */
#guide{display:none}
.bar{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
.bar-brand{font-weight:800;letter-spacing:.08em;font-size:16px;white-space:nowrap}
.bar-brand span{color:var(--red)}
.bar-brand .st{color:var(--ink)}
.bar-brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;line-height:1.2}
.store-line{display:inline-block;margin-top:12px;padding:4px 14px;border:1px solid var(--red);color:var(--red);border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.03em}
.switch{display:flex;gap:4px;background:#EFE8DE;border-radius:999px;padding:3px}
.switch button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.switch button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.g-hero img{width:100%;aspect-ratio:1200/518;object-fit:cover}
.sec{padding:34px 20px 6px}
.sec+.sec{border-top:1px solid var(--line);margin-top:28px}
h1{font-size:25px;line-height:1.35;font-weight:800;margin-bottom:14px}
h2{text-wrap:balance;font-size:21px;line-height:1.4;font-weight:800;margin-bottom:16px;padding-left:14px;position:relative}
h2::before{content:"";position:absolute;left:0;top:.38em;width:5px;height:.95em;background:var(--red);border-radius:2px}
p+p{margin-top:10px}
.lead{font-size:17px;font-weight:600}

ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps>li{counter-increment:s;position:relative;padding-left:40px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;line-height:1.35}
.chip b{display:block;font-size:15px;color:var(--red)}
.chips-cap{font-size:12px;color:var(--muted);margin-top:8px}

.notes{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.note{background:var(--gold);border-radius:10px;padding:11px 14px 11px 40px;position:relative;font-size:15px}
.note::before{content:"✓";position:absolute;left:15px;top:10px;font-weight:800;color:#B07D1E}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:430px){.grid.three{grid-template-columns:1fr 1fr 1fr;gap:10px}.grid.three .card .txt{padding:11px 11px 13px}.grid.three .card .nm{font-size:15px}.grid.three .card p{font-size:13px}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card .txt{padding:14px 16px 16px}
.card .nm{font-weight:800;font-size:17px;line-height:1.35}
.card .sub{font-size:13px;color:var(--ink);opacity:.75;margin-top:1px}
.card .kr{font-size:13px;color:var(--muted);margin-top:1px}
.card .kr::before{content:"KR ";font-size:10px;font-weight:700;color:var(--red);letter-spacing:.05em;vertical-align:1px}
.card p{margin-top:9px;font-size:14px;color:#4A423D;border-top:1px solid var(--line);padding-top:9px}
.list .card{display:grid;grid-template-columns:118px 1fr}
.list .card img{height:100%;aspect-ratio:auto;min-height:118px}
.list .card .txt{padding:12px 14px}
.list .card p{border:0;padding:0;margin-top:5px}

.photo{border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.photo img{width:100%}

.review{background:var(--card);border:1.5px solid var(--red);border-radius:18px;padding:22px 18px;margin-top:4px}
.review .tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em;margin-bottom:10px}
.review h2{padding-left:0;font-size:19px}.review h2::before{display:none}
.rv-img{position:relative;margin:6px -4px 4px}
.rv-labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-weight:700;font-size:14px;margin-bottom:14px}
.rv-labels .kr{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:6px 0 4px;padding:17px 14px;border-radius:14px;background:var(--red);color:#fff;font-size:clamp(15px,4.2vw,18px);white-space:nowrap;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(192,30,45,.25)}
.cta:active{transform:scale(.985)}
.cta svg{flex:none}
.review ol.steps{margin-top:18px}
.fine{margin-top:14px;font-size:13px;color:var(--muted)}

.thanks{text-align:center;padding:44px 20px 60px}
.thanks .big{text-wrap:balance;font-size:21px;font-weight:800;line-height:1.45}
.thanks .big+.big{color:var(--red);margin-top:6px}
.thanks .foot{margin-top:28px;font-size:12px;color:var(--muted);letter-spacing:.1em}
.thanks .back{margin-top:16px;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
</style>
</head>
<body>

<!-- ================= 언어 선택 화면 ================= -->
<section id="select">
  <div class="wrap">
    <div class="hero"><img id="selHero" alt=""></div>
    <div class="sel-body">
      <div class="brand-ko ko">미례국밥</div>
      <div class="brand-sub">味禮 · MIRYE GUKBAP</div>
      <div class="store-line" id="selStore"></div>
      <div class="seal"></div>
      <div class="welcome" id="welcomeLine"></div>
      <div class="choose" id="chooseLine"></div>
      <div class="lang-list" id="langList"></div>
    </div>
  </div>
</section>

<!-- ================= 가이드 화면 ================= -->
<section id="guide">
  <div class="bar"><div class="wrap">
    <div class="bar-brand"><div class="ko">미례국밥 <span>·</span> <span class="st" id="barStore"></span></div><small id="barLocal"></small></div>
    <div class="switch" id="switch"></div>
  </div></div>
  <div class="wrap" id="content"></div>
</section>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const params = new URLSearchParams(location.search);
const store = STORES[params.get("s")] || STORES[Object.keys(STORES)[0]];
const active = LANGS.filter(l => TEXT[l]);

function guess(){
  const nav = (navigator.languages || [navigator.language || ""]).map(x => (x||"").toLowerCase());
  for (const n of nav){ const c = n.slice(0,2); if (active.includes(c)) return c; }
  return null;
}

function renderSelect(){
  $("#selHero").src = IMG[store.hero];
  $("#selStore").innerHTML = `<span class="ko">${store.name.ko}</span> · ${active.map(l=>esc(store.name[l])).join(" · ")}`;
  const g = guess();
  const order = g ? [g, ...active.filter(l => l !== g)] : active;
  $("#welcomeLine").textContent = order.map(l => LANG_META[l].welcome).join(" · ");
  $("#chooseLine").innerHTML = order.map(l => esc(LANG_META[l].choose)).join("<br>");
  $("#langList").innerHTML = order.map(l =>
    `<button class="lang-btn${l===g?" suggested":""}" data-l="${l}">
       <span>${esc(LANG_META[l].label)}${LANG_META[l].sub?`<small>${esc(LANG_META[l].sub)}</small>`:""}</span><span class="arr">›</span>
     </button>`).join("");
  document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => go(b.dataset.l));
}

        <span class="tag">${esc(T.rvTag)}</span>
        <h2>${esc(T.rvTitle)}</h2>
        ${T.rvNames ? `<div class="rv-img"><img src="${IMG.review}" alt=""></div>
        <div class="rv-labels">
          <div>${esc(T.rvNames[0])}<span class="kr ko">순대</span></div>
          <div>${esc(T.rvNames[1])}<span class="kr ko">냉제육</span></div>
        </div>` : ""}
        <p class="lead">${esc(T.rvLead)}</p>
        ${T.rvBody.map(p=>`<p>${esc(p)}</p>`).join("")}
        <a class="cta" href="${esc(store.reviewUrl)}" target="_blank" rel="noopener">${ic}${esc(T.rvBtn)}</a>
        ${T.rvSteps ? `<ol class="steps">${T.rvSteps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>` : ""}
        ${T.rvFine ? `<div class="fine">${esc(T.rvFine)}</div>` : ""}
      </div>
    </div>`;

  $("#content").innerHTML = `
    <div class="g-hero"><img src="${IMG[store.hero]}" alt=""></div>

    <div class="sec">
      <h1>${esc(T.title)}</h1>
      ${T.intro.map((p,i)=>`<p${i===0?' class="lead"':""}>${esc(p)}</p>`).join("")}
    </div>

    <div class="sec">
      <h2>${esc(T.howTitle)}</h2>
      <ol class="steps">${T.how.map(s=>`<li>${esc(s.t)}${s.c?`<div class="chips">${s.c.map(chip).join("")}</div>`:""}</li>`).join("")}</ol>
      <div class="chips-cap">${esc(T.chipsCap)}</div>
      <div class="notes">${T.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div>
    </div>

    <div class="sec">
      <h2>${esc(T.sidesTitle)}</h2>
      <div class="grid three">${SIDES.map(s=>card(IMG[s.id], T.sides[s.id][0], s.kr, T.sides[s.id][1])).join("")}</div>
    </div>

${T.rvSteps && store.reviewUrl ? review : ""}

    <div class="sec">
      <h2>${esc(T.ingTitle)}</h2>
      <div class="grid list">${INGREDIENTS.map(s=>card(IMG[s.id], T.ing[s.id][0], s.kr, T.ing[s.id][1])).join("")}</div>
    </div>

    <div class="sec">
      <h2>${esc(T.kimchiTitle)}</h2>
      <div class="photo"><img src="${IMG.kimchi}" alt="" loading="lazy"></div>
      ${T.kimchi.map(p=>`<p>${esc(p)}</p>`).join("")}
    </div>

    ${!T.rvSteps && store.reviewUrl ? review : ""}

    <div class="thanks">
      <div class="big">${esc(T.thanks[0])}</div>
      <div class="big">${esc(T.thanks[1])}</div>
      <button class="back" id="backBtn">🌐 ${esc(T.back)}</button>
      <div class="foot ko">미례국밥 · 味禮 · MIRYE GUKBAP</div>
    </div>`;
  $("#backBtn").onclick = () => { location.hash = ""; };
}

function go(l){ location.hash = l; }

function route(){
  const l = location.hash.slice(1);
  if (active.includes(l)){
    renderGuide(l);
    $("#select").style.display = "none";
    $("#guide").style.display = "block";
    window.scrollTo(0,0);
  } else {
    renderSelect();
    $("#guide").style.display = "none";
    $("#select").style.display = "flex";
    window.scrollTo(0,0);
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
